[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "factslap"
version = "2.0.0a1"
description = "Fact-check claims against scientific evidence: a RAG pipeline with verified citations and an evaluation harness."
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "httpx>=0.27",
  "pydantic>=2.8",
  "python-dotenv>=1.0",
  "pillow>=11",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-asyncio>=0.24", "respx>=0.21", "ruff>=0.6", "uvicorn>=0.30"]

[tool.setuptools.packages.find]
include = ["factslap*"]

[tool.setuptools.package-data]
factslap = ["assets/*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B905", "UP042", "UP047"]
